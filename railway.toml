[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter backend run db:generate && pnpm --filter backend run build"

[deploy]
startCommand = "pnpm --filter backend run db:deploy && pnpm --filter backend run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
